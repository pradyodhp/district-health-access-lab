name: Verify evidence and decision workbench
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check src scripts tests
      - run: python3 scripts/build_data.py && git diff --exit-code -- data/processed/pilot_indicators.csv
      - run: python3 -m pytest -q --cov=health_access --cov-report=term-missing
      - run: pip-audit -r requirements.txt
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: cd web && npm ci && npm test && npm run build && npm audit --audit-level=moderate
      - run: |
          uvicorn health_access.api:app --app-dir src --host 127.0.0.1 --port 8000 &
          PID=$!
          trap 'kill $PID' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break || sleep 1; done
          python3 scripts/smoke_api.py
      - run: python3 scripts/demo.py --output /tmp/training-demo
